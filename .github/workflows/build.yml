name: Build Windows and macOS Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos-signed:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: link/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        working-directory: link
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "Setting up Apple Developer Certificate..."
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "github-actions" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "github-actions" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -s build.keychain login.keychain

      - name: Build and Sign Intel macOS app
        working-directory: link
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: hefen zhao (9HBAJ6NGZM)"
          APPLE_TEAM_ID: "9HBAJ6NGZM"
        run: |
          security unlock-keychain -p "github-actions" build.keychain
          cargo tauri build --target x86_64-apple-darwin

      - name: Build and Sign ARM macOS app
        working-directory: link
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: hefen zhao (9HBAJ6NGZM)"
          APPLE_TEAM_ID: "9HBAJ6NGZM"
        run: |
          security unlock-keychain -p "github-actions" build.keychain
          cargo tauri build --target aarch64-apple-darwin

      - name: Create Signed Universal Binary
        working-directory: link
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: hefen zhao (9HBAJ6NGZM)"
        run: |
          # 创建通用目录结构
          mkdir -p target/universal-apple-darwin/release/bundle/macos
          mkdir -p target/universal-apple-darwin/release/bundle/dmg

          # 复制 ARM 版本作为基础
          cp -r target/aarch64-apple-darwin/release/bundle/macos/RemotePadServer.app \
            target/universal-apple-darwin/release/bundle/macos/

          # 使用 lipo 合并为通用二进制
          lipo -create \
            target/x86_64-apple-darwin/release/bundle/macos/RemotePadServer.app/Contents/MacOS/RemotePadServer \
            target/aarch64-apple-darwin/release/bundle/macos/RemotePadServer.app/Contents/MacOS/RemotePadServer \
            -output target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app/Contents/MacOS/RemotePadServer

          # 验证通用二进制
          echo "=== Verifying universal binary ==="
          lipo -info target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app/Contents/MacOS/RemotePadServer

          # 重新签名通用应用
          echo "=== Re-signing universal app ==="
          security unlock-keychain -p "github-actions" build.keychain
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --entitlements src-tauri/entitlements.plist \
            target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app

          # 验证签名
          codesign -dv --verbose=4 target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app

      - name: Create Signed Universal DMG
        working-directory: link
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: hefen zhao (9HBAJ6NGZM)"
        run: |
          # 使用 ARM 版本的 DMG 作为基础，但替换为通用应用
          ARM_DMG=$(ls target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)

          if [ -f "$ARM_DMG" ]; then
            echo "Creating universal DMG based on ARM template..."

            # 创建临时目录
            mkdir -p /tmp/dmg_contents

            # 挂载 ARM DMG
            hdiutil attach "$ARM_DMG" -mountpoint /tmp/arm_mount -nobrowse

            # 复制内容
            cp -r /tmp/arm_mount/* /tmp/dmg_contents/ 2>/dev/null || true

            # 卸载
            hdiutil detach /tmp/arm_mount -force

            # 替换为通用应用
            rm -rf /tmp/dmg_contents/RemotePadServer.app
            cp -r target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app /tmp/dmg_contents/

            # 创建新的 DMG
            hdiutil create \
              -volname "RemotePadServer" \
              -srcfolder /tmp/dmg_contents \
              -ov \
              -format UDZO \
              target/universal-apple-darwin/release/bundle/dmg/RemotePadServer_0.1.0_universal.dmg

            # 签名 DMG
            security unlock-keychain -p "github-actions" build.keychain
            codesign --sign "$APPLE_SIGNING_IDENTITY" \
              target/universal-apple-darwin/release/bundle/dmg/RemotePadServer_0.1.0_universal.dmg

            rm -rf /tmp/dmg_contents
          else
            echo "Creating DMG with hdiutil..."
            # 创建简单的 DMG
            mkdir -p /tmp/dmg_contents
            cp -r target/universal-apple-darwin/release/bundle/macos/RemotePadServer.app /tmp/dmg_contents/
            ln -s /Applications /tmp/dmg_contents/Applications

            hdiutil create \
              -volname "RemotePadServer" \
              -srcfolder /tmp/dmg_contents \
              -ov \
              -format UDZO \
              target/universal-apple-darwin/release/bundle/dmg/RemotePadServer_0.1.0_universal.dmg

            # 签名 DMG
            security unlock-keychain -p "github-actions" build.keychain
            codesign --sign "$APPLE_SIGNING_IDENTITY" \
              target/universal-apple-darwin/release/bundle/dmg/RemotePadServer_0.1.0_universal.dmg

            rm -rf /tmp/dmg_contents
          fi

          echo "=== Universal signed DMG created ==="
          ls -la target/universal-apple-darwin/release/bundle/dmg/

      - name: Upload macOS Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-universal-signed
          path: |
            link/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: link/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: link
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Windows app
        working-directory: link
        run: cargo tauri build

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            link/target/release/bundle/**/*.msi
            link/target/release/bundle/**/*.exe
          if-no-files-found: warn

  release:
    needs: [build-macos-signed, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app-universal-signed
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: ./artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/**/*.dmg
            ./artifacts/**/*.msi
            ./artifacts/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
