name: Build Windows and macOS Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: link/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        working-directory: link
        run: npm ci

      - name: Build macOS app
        working-directory: link
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: List bundle directory
        run: |
          echo "Listing target directory:"
          find link/src-tauri/target -name "*.dmg" -o -name "*.app" 2>/dev/null || echo "No dmg/app found"
          echo ""
          echo "Full bundle structure:"
          ls -la link/src-tauri/target/aarch64-apple-darwin/release/bundle/ 2>/dev/null || echo "Bundle dir not found"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            link/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            link/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.app
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: link/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: link
        run: npm ci

      - name: Build Windows app
        working-directory: link
        run: npm run tauri build

      - name: List bundle directory
        shell: pwsh
        run: |
          Write-Host "Listing target directory..."
          Get-ChildItem -Path "link/src-tauri/target" -Recurse -Include "*.msi","*.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host ""
          Write-Host "Bundle structure:"
          Get-ChildItem -Path "link/src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            link/src-tauri/target/release/bundle/**/*.msi
            link/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: ./artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: ./artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/macos/**/*.dmg
            ./artifacts/windows/**/*.msi
            ./artifacts/windows/**/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
